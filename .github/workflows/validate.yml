name: AquaSignal Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Python syntax
        run: python -m py_compile app.py

      - name: Validate frontend structure
        run: |
          test -s index.html
          grep -q '<!DOCTYPE html>' index.html
          grep -q 'function analyze' index.html
          grep -q 'function calcScore' index.html
          grep -q 'function closeResult' index.html
          grep -q 'function scrollToApp' index.html
          grep -q 'wave-1' index.html
          grep -q 'wave-2' index.html
          echo "AquaSignal frontend structure check passed."
